services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./auth-service
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:4000}
      AUTH_PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/auth
      AUTH_MASTER_KEY: ${AUTH_MASTER_KEY:?AUTH_MASTER_KEY required}
      IP_RATE_MAX: ${IP_RATE_MAX:-10}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe#2026}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"

volumes:
  pgdata:
